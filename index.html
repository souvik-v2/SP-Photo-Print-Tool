<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Souvik Photo Print Layout Tool</title>
    <style>
      :root {
        --bg: #e4e8ec;
        --panel: #fff;
        --ink: #17212b;
        --mute: #5c6975;
        --line: #d5dbe1;
        --accent: #0b6e8a;
        --accent-ink: #fff;
        --soft: #eaf4f7;
        --stage: #cfd5db;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #10161c;
          --panel: #18212a;
          --ink: #e8edf2;
          --mute: #97a4b0;
          --line: #2b3742;
          --accent: #4cb8d6;
          --accent-ink: #06222b;
          --soft: #16323c;
          --stage: #0c1116;
        }
      }
      :root[data-theme="dark"] {
        --bg: #10161c;
        --panel: #18212a;
        --ink: #e8edf2;
        --mute: #97a4b0;
        --line: #2b3742;
        --accent: #4cb8d6;
        --accent-ink: #06222b;
        --soft: #16323c;
        --stage: #0c1116;
      }
      *,
      *:before,
      *:after {
        box-sizing: inherit;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.45 "Segoe UI",
          system-ui,
          -apple-system,
          Roboto,
          sans-serif;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .app {
        height: 100%;
        display: grid;
        grid-template-columns: 350px 1fr;
        grid-template-rows: auto 1fr;
      }
      header {
        grid-column: 1/-1;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 10px 18px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }
      header h1 {
        font-size: 17px;
        margin: 0;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      header .sum {
        margin-left: auto;
        color: var(--mute);
        text-align: right;
      }
      .btn {
        border: 1px solid var(--line);
        background: var(--panel);
        padding: 7px 12px;
        border-radius: 6px;
        cursor: pointer;
      }
      .btn:hover {
        border-color: var(--accent);
      }
      .btn.pri {
        background: var(--accent);
        color: var(--accent-ink);
        border-color: var(--accent);
        font-weight: 600;
        padding: 8px 18px;
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .btn.sm {
        padding: 3px 9px;
        font-size: 12.5px;
      }
      .side {
        overflow-y: auto;
        background: var(--panel);
        border-right: 1px solid var(--line);
        padding: 6px 18px 24px;
      }
      .side section {
        padding: 14px 0;
        border-bottom: 1px solid var(--line);
      }
      .side section:last-child {
        border: 0;
      }
      h2 {
        font-size: 13px;
        margin: 0 0 10px;
        font-weight: 700;
      }
      label.f {
        display: block;
        margin: 0 0 10px;
        color: var(--mute);
        font-size: 12.5px;
      }
      label.f > span {
        display: block;
        margin-bottom: 3px;
      }
      select,
      input[type="number"] {
        width: 100%;
        padding: 7px 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel);
      }
      .row {
        display: flex;
        gap: 8px;
      }
      .row > * {
        flex: 1;
      }
      .seg {
        display: flex;
        border: 1px solid var(--line);
        border-radius: 6px;
        overflow: hidden;
        margin-bottom: 10px;
      }
      .seg button {
        flex: 1;
        border: 0;
        background: none;
        padding: 7px;
        cursor: pointer;
      }
      .seg button[aria-pressed="true"] {
        background: var(--accent);
        color: var(--accent-ink);
        font-weight: 600;
      }
      .drop {
        border: 2px dashed var(--line);
        border-radius: 10px;
        padding: 22px 12px;
        text-align: center;
        cursor: pointer;
        color: var(--mute);
      }
      .drop:hover,
      .drop.over {
        border-color: var(--accent);
        background: var(--soft);
        color: var(--ink);
      }
      .drop strong {
        display: block;
        color: var(--ink);
        font-size: 14px;
      }
      .list {
        margin-top: 10px;
        display: grid;
        gap: 6px;
      }
      .item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px;
        border: 1px solid var(--line);
        border-radius: 8px;
        cursor: pointer;
      }
      .item.on {
        border-color: var(--accent);
        background: var(--soft);
      }
      .item img {
        width: 38px;
        height: 38px;
        object-fit: cover;
        border-radius: 4px;
        flex: none;
      }
      .item .nm {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 12.5px;
      }
      .step {
        display: flex;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 6px;
        overflow: hidden;
        flex: none;
      }
      .step button {
        border: 0;
        background: none;
        width: 26px;
        height: 28px;
        cursor: pointer;
        font-size: 16px;
      }
      .step button:hover {
        background: var(--soft);
      }
      .step input {
        width: 38px;
        border: 0;
        text-align: center;
        padding: 0;
        background: transparent;
        -moz-appearance: textfield;
      }
      .step input::-webkit-inner-spin-button {
        display: none;
      }
      .x {
        border: 0;
        background: none;
        color: var(--mute);
        cursor: pointer;
        font-size: 18px;
        padding: 0 4px;
      }
      .x:hover {
        color: #c0392b;
      }
      .edit canvas {
        display: block;
        width: 100%;
        max-width: 250px;
        margin: 0 auto 10px;
        border: 1px solid var(--line);
        background: #fff;
        cursor: grab;
        touch-action: none;
        border-radius: 2px;
      }
      .edit canvas:active {
        cursor: grabbing;
      }
      .edit .hint2 {
        text-align: center;
        color: var(--mute);
        font-size: 12px;
        margin: -4px 0 10px;
      }
      input[type="range"] {
        width: 100%;
        accent-color: var(--accent);
      }
      .chk {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 6px 0;
      }
      .chk input {
        accent-color: var(--accent);
        width: 16px;
        height: 16px;
      }
      main {
        overflow: auto;
        background: var(--stage);
        padding: 24px;
      }
      .zoomwrap {
        width: max-content;
        margin: 0 auto;
      }
      .sheetwrap {
        margin-bottom: 26px;
      }
      .sheetlabel {
        color: var(--mute);
        font-size: 12.5px;
        margin: 0 0 6px;
      }
      .sheet {
        width: var(--w);
        height: var(--h);
        background: #fff;
        box-shadow: 0 2px 14px rgba(0, 0, 0, 0.28);
        position: relative;
        overflow: hidden;
      }
      .grid {
        display: grid;
        align-content: start;
      }
      .c {
        border: 0;
        background: #fff;
      }
      .c.b {
        border: 0.3mm solid #000;
      }
      .c img {
        display: block;
        width: 100%;
        height: 100%;
      }
      .empty {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #7b8794;
        font-size: 16px;
        text-align: center;
        padding: 30mm;
      }
      .warn {
        background: #fff3cd;
        color: #664d03;
        padding: 8px 12px;
        border-radius: 6px;
        margin-bottom: 12px;
        max-width: 520px;
      }
      @media (max-width: 820px) {
        .app {
          height: auto;
          grid-template-columns: 1fr;
        }
        .side {
          border-right: 0;
          overflow: visible;
        }
        main {
          padding: 12px;
        }
        header {
          flex-wrap: wrap;
        }
      }
      @media print {
        html,
        body {
          height: auto;
          background: #fff;
        }
        header,
        .side,
        .sheetlabel,
        .empty,
        .warn {
          display: none !important;
        }
        .app {
          display: block;
          height: auto;
        }
        main {
          padding: 0;
          overflow: visible;
          background: none;
        }
        .zoomwrap {
          zoom: 1 !important;
          width: auto;
          margin: 0;
        }
        .sheetwrap {
          margin: 0;
        }
        .sheet {
          box-shadow: none;
          height: calc(var(--h) - 0.4mm);
          break-after: page;
        }
        .sheetwrap:last-child .sheet {
          break-after: auto;
        }
        :root {
          padding: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <h1>Photo print layout</h1>
        <div class="sum" id="sum"></div>
        <button class="btn pri" id="printBtn" disabled>Print sheet</button>
      </header>

      <aside class="side">
        <section>
          <h2>1. Add photos</h2>
          <div
            class="drop"
            id="drop"
            tabindex="0"
            role="button"
            aria-label="Upload photos"
          >
            <strong>Drop photos here</strong>or click to choose files
          </div>
          <input type="file" id="file" accept="image/*" multiple hidden />
          <div class="list" id="list"></div>
        </section>

        <section class="edit" id="editSec" hidden>
          <h2>2. Adjust selected photo</h2>
          <canvas id="ed"></canvas>
          <p class="hint2">
            Drag to move the photo. Scroll or use the slider to zoom.
          </p>
          <label class="f"
            ><span>Zoom <b id="zv">100%</b></span
            ><input
              type="range"
              id="zoom"
              min="0.5"
              max="4"
              step="0.01"
              value="1"
          /></label>
          <div class="row">
            <button class="btn sm" id="reset">Reset crop</button
            ><button class="btn sm" id="rot">Rotate 90°</button>
          </div>
          <label class="chk"
            ><input type="checkbox" id="border" /> Thin black border</label
          >
          <button class="btn sm" id="borderAll">
            Apply border setting to all photos
          </button>
        </section>

        <section>
          <h2>3. Paper and photo size</h2>
          <div class="seg" id="paper" role="group" aria-label="Paper">
            <button data-v="a4" aria-pressed="true">A4 sheet</button>
            <button data-v="p46" aria-pressed="false">4×6 in paper</button>
          </div>
          <div class="seg" id="orient" role="group" aria-label="Orientation">
            <button data-v="0" aria-pressed="true">Portrait</button>
            <button data-v="1" aria-pressed="false">Landscape</button>
          </div>
          <label class="f"
            ><span>Photo size</span>
            <select id="size">
              <option value="in">Passport, India (35×45 mm)</option>
              <option value="us">Passport, US (2×2 in)</option>
              <option value="visa">Visa (33×48 mm)</option>
              <option value="pan">Stamp (25×35 mm)</option>
              <option value="mini">Small (20×25 mm)</option>
              <option value="custom">Custom size</option>
            </select></label
          >
          <div class="row" id="customRow" hidden>
            <label class="f"
              ><span>Width (mm)</span
              ><input
                type="number"
                id="cw"
                value="35"
                min="10"
                max="200"
                step="0.5"
            /></label>
            <label class="f"
              ><span>Height (mm)</span
              ><input
                type="number"
                id="ch"
                value="45"
                min="10"
                max="280"
                step="0.5"
            /></label>
          </div>
          <div class="row">
            <label class="f"
              ><span>Sheet margin (mm)</span
              ><input
                type="number"
                id="mar"
                value="5"
                min="0"
                max="30"
                step="0.5"
            /></label>
            <label class="f"
              ><span>Gap (mm)</span
              ><input
                type="number"
                id="gap"
                value="2"
                min="0"
                max="20"
                step="0.5"
            /></label>
          </div>
        </section>

        <section>
          <h2>4. Copies</h2>
          <p style="margin: 0 0 10px; color: var(--mute)">
            Set copies for each photo in the list above. Extra copies spill onto
            more sheets.
          </p>
          <button class="btn" id="fill">
            Fill the sheet with selected photo
          </button>
        </section>
      </aside>

      <main id="stage">
        <div class="zoomwrap" id="zw">
          <div id="warn"></div>
          <div id="sheets"></div>
        </div>
      </main>
    </div>

    <script>
      const PAPERS = {
        a4: { w: 210, h: 297, n: "A4" },
        p46: { w: 101.6, h: 152.4, n: "4×6 in" },
      };
      const SIZES = {
        in: [35, 45],
        us: [50.8, 50.8],
        visa: [33, 48],
        pan: [25, 35],
        mini: [20, 25],
      };
      const S = {
        paper: "a4",
        land: false,
        size: "in",
        cw: 35,
        ch: 45,
        mar: 5,
        gap: 2,
      };
      let photos = [],
        active = null,
        uid = 0;
      const $ = (id) => document.getElementById(id);
      const esc = (s) =>
        s.replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      const dims = () =>
        S.size === "custom" ? [+S.cw || 35, +S.ch || 45] : SIZES[S.size];
      const sheetDims = () => {
        const p = PAPERS[S.paper];
        return S.land ? [p.h, p.w] : [p.w, p.h];
      };
      const getActive = () => photos.find((p) => p.id === active);
      const cropW = (p, ar) =>
        Math.min(p.img.naturalWidth, p.img.naturalHeight * ar) / p.zoom;

      function drawCrop(p, cv, W, H) {
        cv.width = W;
        cv.height = H;
        const x = cv.getContext("2d");
        x.fillStyle = "#fff";
        x.fillRect(0, 0, W, H);
        const iw = p.img.naturalWidth,
          ih = p.img.naturalHeight,
          cw = cropW(p, W / H),
          k = W / cw,
          chh = cw / (W / H);
        x.imageSmoothingQuality = "high";
        x.drawImage(
          p.img,
          -(p.cx - cw / 2) * k,
          -(p.cy - chh / 2) * k,
          iw * k,
          ih * k,
        );
      }
      function bake(p) {
        const [w, h] = dims(),
          cv = document.createElement("canvas");
        drawCrop(
          p,
          cv,
          Math.round((w / 25.4) * 300),
          Math.round((h / 25.4) * 300),
        );
        p.url = cv.toDataURL("image/jpeg", 0.95);
      }
      function drawEditor() {
        const p = getActive();
        if (!p) return;
        const [w, h] = dims(),
          cv = $("ed");
        cv.style.aspectRatio = w + "/" + h;
        drawCrop(p, cv, 360, Math.round((360 * h) / w));
      }
      function addFiles(files) {
        [...files]
          .filter((f) => f.type.startsWith("image/"))
          .forEach((f) => {
            const img = new Image(),
              src = URL.createObjectURL(f);
            img.onload = () => {
              const p = {
                id: ++uid,
                name: f.name,
                img,
                src,
                zoom: 1,
                cx: img.naturalWidth / 2,
                cy: img.naturalHeight / 2,
                copies: 6,
                border: true,
              };
              bake(p);
              photos.push(p);
              active = p.id;
              refresh(true);
            };
            img.src = src;
          });
      }
      function rotate(p) {
        const c = document.createElement("canvas"),
          iw = p.img.naturalWidth,
          ih = p.img.naturalHeight;
        c.width = ih;
        c.height = iw;
        const x = c.getContext("2d");
        x.translate(ih, 0);
        x.rotate(Math.PI / 2);
        x.drawImage(p.img, 0, 0);
        const im = new Image();
        im.onload = () => {
          p.img = im;
          p.cx = im.naturalWidth / 2;
          p.cy = im.naturalHeight / 2;
          p.zoom = 1;
          refresh(true);
        };
        im.src = c.toDataURL("image/jpeg", 0.95);
      }

      function renderList() {
        $("list").innerHTML = photos
          .map(
            (
              p,
            ) => `<div class="item ${p.id === active ? "on" : ""}" data-id="${p.id}">
    <img src="${p.src}" alt=""><span class="nm" title="${esc(p.name)}">${esc(p.name)}</span>
    <div class="step"><button data-a="dec" aria-label="Fewer copies">−</button><input type="number" min="0" max="500" value="${p.copies}" aria-label="Copies"><button data-a="inc" aria-label="More copies">+</button></div>
    <button class="x" data-a="del" aria-label="Remove photo">×</button></div>`,
          )
          .join("");
        $("editSec").hidden = !photos.length;
      }
      function syncEditor() {
        const p = getActive();
        if (!p) return;
        $("zoom").value = p.zoom;
        $("zv").textContent = Math.round(p.zoom * 100) + "%";
        $("border").checked = p.border;
        drawEditor();
      }
      function layout() {
        const [w, h] = dims(),
          [W, H] = sheetDims(),
          m = +S.mar || 0,
          g = +S.gap || 0;
        const cols = Math.max(0, Math.floor((W - 2 * m + g) / (w + g))),
          rows = Math.max(0, Math.floor((H - 2 * m + g) / (h + g)));
        return { w, h, W, H, m, g, cols, rows, cap: cols * rows };
      }
      function renderSheets() {
        const L = layout(),
          items = [];
        photos.forEach((p) => {
          for (let i = 0; i < p.copies; i++) items.push(p);
        });
        $("warn").innerHTML = L.cap
          ? ""
          : '<div class="warn">This photo size does not fit on the paper with the current margin. Reduce the size or margin.</div>';
        let pages = L.cap ? Math.max(1, Math.ceil(items.length / L.cap)) : 1,
          html = "";
        for (let i = 0; i < pages; i++) {
          const chunk = L.cap ? items.slice(i * L.cap, (i + 1) * L.cap) : [];
          html += `<div class="sheetwrap"><p class="sheetlabel">Sheet ${i + 1} of ${pages} · ${PAPERS[S.paper].n} · ${chunk.length} of ${L.cap} slots used</p>
    <div class="sheet" style="--w:${L.W}mm;--h:${L.H}mm;padding:${L.m}mm">
    <div class="grid" style="grid-template-columns:repeat(${L.cols},${L.w}mm);grid-auto-rows:${L.h}mm;gap:${L.g}mm;justify-content:center">
    ${chunk.map((p) => `<div class="c ${p.border ? "b" : ""}"><img src="${p.url}" alt=""></div>`).join("")}</div>
    ${items.length ? "" : '<div class="empty">Upload a photo to see the print layout</div>'}</div></div>`;
        }
        $("sheets").innerHTML = html;
        let st = document.getElementById("pg");
        if (!st) {
          st = document.createElement("style");
          st.id = "pg";
          document.head.appendChild(st);
        }
        st.textContent = `@page{size:${L.W}mm ${L.H}mm;margin:0}`;
        const total = items.length;
        $("sum").textContent = total
          ? `${total} photo${total > 1 ? "s" : ""} · ${L.cap} per sheet (${L.cols}×${L.rows}) · ${pages} sheet${pages > 1 ? "s" : ""}`
          : `${L.cap} photos fit per sheet (${L.cols}×${L.rows})`;
        $("printBtn").disabled = !total || !L.cap;
        fitZoom();
      }
      function fitZoom() {
        const [W] = sheetDims(),
          avail = $("stage").clientWidth - (innerWidth <= 820 ? 24 : 48);
        $("zw").style.zoom = Math.min(1.2, Math.max(0.2, avail / (W * 3.7795)));
      }
      let raf = 0;
      function scheduleSheets() {
        cancelAnimationFrame(raf);
        raf = requestAnimationFrame(renderSheets);
      }
      function refresh(full) {
        if (full) {
          renderList();
          syncEditor();
        }
        photos.forEach(bake);
        renderSheets();
      }

      /* upload */
      const drop = $("drop"),
        file = $("file");
      drop.onclick = () => file.click();
      drop.onkeydown = (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          file.click();
        }
      };
      file.onchange = () => {
        addFiles(file.files);
        file.value = "";
      };
      ["dragenter", "dragover"].forEach((t) =>
        drop.addEventListener(t, (e) => {
          e.preventDefault();
          drop.classList.add("over");
        }),
      );
      ["dragleave", "drop"].forEach((t) =>
        drop.addEventListener(t, (e) => {
          e.preventDefault();
          drop.classList.remove("over");
        }),
      );
      drop.addEventListener("drop", (e) => addFiles(e.dataTransfer.files));
      addEventListener("dragover", (e) => e.preventDefault());
      addEventListener("drop", (e) => {
        if (!drop.contains(e.target)) {
          e.preventDefault();
          addFiles(e.dataTransfer.files);
        }
      });

      /* list */
      $("list").addEventListener("click", (e) => {
        const it = e.target.closest(".item");
        if (!it) return;
        const p = photos.find((x) => x.id == it.dataset.id),
          a = e.target.dataset.a;
        if (a === "del") {
          URL.revokeObjectURL(p.src);
          photos = photos.filter((x) => x !== p);
          if (active === p.id) active = photos.length ? photos[0].id : null;
          renderList();
          syncEditor();
          renderSheets();
          return;
        }
        if (a === "inc") p.copies = Math.min(500, p.copies + 1);
        else if (a === "dec") p.copies = Math.max(0, p.copies - 1);
        else if (e.target.tagName === "INPUT") return;
        active = p.id;
        renderList();
        syncEditor();
        renderSheets();
      });
      $("list").addEventListener("change", (e) => {
        if (e.target.tagName !== "INPUT") return;
        const p = photos.find(
          (x) => x.id == e.target.closest(".item").dataset.id,
        );
        p.copies = Math.max(0, Math.min(500, parseInt(e.target.value) || 0));
        renderList();
        renderSheets();
      });

      /* editor */
      function edit(fn) {
        const p = getActive();
        if (!p) return;
        fn(p);
        bake(p);
        drawEditor();
        $("zoom").value = p.zoom;
        $("zv").textContent = Math.round(p.zoom * 100) + "%";
        scheduleSheets();
      }
      $("zoom").oninput = (e) => edit((p) => (p.zoom = +e.target.value));
      $("reset").onclick = () =>
        edit((p) => {
          p.zoom = 1;
          p.cx = p.img.naturalWidth / 2;
          p.cy = p.img.naturalHeight / 2;
        });
      $("rot").onclick = () => {
        const p = getActive();
        if (p) rotate(p);
      };
      $("border").onchange = (e) => {
        const p = getActive();
        if (p) {
          p.border = e.target.checked;
          renderSheets();
        }
      };
      $("borderAll").onclick = () => {
        const v = $("border").checked;
        photos.forEach((p) => (p.border = v));
        renderSheets();
      };
      const ed = $("ed");
      let drag = null;
      function clampC(p) {
        p.cx = Math.max(0, Math.min(p.img.naturalWidth, p.cx));
        p.cy = Math.max(0, Math.min(p.img.naturalHeight, p.cy));
      }
      ed.onpointerdown = (e) => {
        drag = { x: e.clientX, y: e.clientY };
        ed.setPointerCapture(e.pointerId);
      };
      ed.onpointermove = (e) => {
        if (!drag) return;
        const p = getActive(),
          [w, h] = dims(),
          k = cropW(p, w / h) / ed.getBoundingClientRect().width;
        const dx = e.clientX - drag.x,
          dy = e.clientY - drag.y;
        drag = { x: e.clientX, y: e.clientY };
        edit((q) => {
          q.cx -= dx * k;
          q.cy -= dy * k;
          clampC(q);
        });
      };
      ed.onpointerup = ed.onpointercancel = () => (drag = null);
      ed.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          edit(
            (p) =>
              (p.zoom = Math.max(
                0.5,
                Math.min(4, p.zoom * (e.deltaY < 0 ? 1.05 : 0.95)),
              )),
          );
        },
        { passive: false },
      );

      /* layout controls */
      function seg(id, fn) {
        $(id).addEventListener("click", (e) => {
          const b = e.target.closest("button");
          if (!b) return;
          [...$(id).children].forEach((x) =>
            x.setAttribute("aria-pressed", x === b),
          );
          fn(b.dataset.v);
        });
      }
      seg("paper", (v) => {
        S.paper = v;
        renderSheets();
      });
      seg("orient", (v) => {
        S.land = v === "1";
        renderSheets();
      });
      $("size").onchange = (e) => {
        S.size = e.target.value;
        $("customRow").hidden = S.size !== "custom";
        refresh(false);
        drawEditor();
      };
      [
        ["cw", "cw"],
        ["ch", "ch"],
        ["mar", "mar"],
        ["gap", "gap"],
      ].forEach(
        ([id, k]) =>
          ($(id).oninput = (e) => {
            S[k] = e.target.value;
            if (k === "cw" || k === "ch") {
              photos.forEach(bake);
              drawEditor();
            }
            scheduleSheets();
          }),
      );
      $("fill").onclick = () => {
        const p = getActive();
        if (!p) return;
        const L = layout();
        if (!L.cap) return;
        const total = photos.reduce((s, x) => s + x.copies, 0),
          rem = total % L.cap;
        p.copies += rem === 0 ? (total === 0 ? L.cap : 0) : L.cap - rem;
        p.copies = Math.min(500, p.copies);
        renderList();
        renderSheets();
      };
      $("printBtn").onclick = () => window.print();
      new ResizeObserver(fitZoom).observe($("stage"));
      renderSheets();
    </script>
  </body>
</html>
